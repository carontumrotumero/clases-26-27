<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi Horario de Clase</title>
  <meta name="description" content="Horario semanal de clase con festivos, avisos de días sin asistir y tareas pendientes." />
  <meta name="theme-color" content="#101216" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <link rel="icon" href="data:," />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="lockScreen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-icon" id="lockIcon"></div>
      <h1>Horario de clase</h1>
      <p>Introduce la contraseña que te ha dado tu compañero para ver el horario.</p>
      <form id="lockForm" autocomplete="off">
        <input type="password" id="lockInput" placeholder="Contraseña" autocomplete="current-password" />
        <button type="submit" class="btn primary">Entrar</button>
      </form>
      <p class="lock-error" id="lockError" hidden>Contraseña incorrecta.</p>
    </div>
  </div>

  <div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="icon" id="brandIcon"></span>
        <span>Mi Horario</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notifBtn" title="Notificaciones" aria-label="Notificaciones"></button>
        <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema"></button>
      </div>
    </div>
    <div class="week-nav">
      <button class="icon-btn" id="prevWeek" aria-label="Semana anterior"></button>
      <div class="week-label" id="weekLabel"></div>
      <button class="icon-btn" id="nextWeek" aria-label="Semana siguiente"></button>
    </div>
  </header>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="wrap">
    <main id="dayContent"></main>

    <section class="tasks">
      <div class="section-heading-row">
        <h2 class="section-heading"><span id="tasksIcon"></span>Tareas a entregar</h2>
        <button class="icon-btn" id="addTaskBtn" title="Añadir tarea" aria-label="Añadir tarea"></button>
      </div>
      <form id="taskForm" class="inline-form" hidden>
        <input type="text" id="taskSubject" placeholder="Asignatura" list="subjectList" required />
        <datalist id="subjectList"></datalist>
        <input type="text" id="taskTitle" placeholder="Título de la tarea" required />
        <input type="datetime-local" id="taskDue" required />
        <input type="url" id="taskLink" placeholder="Enlace (opcional)" />
        <div class="inline-form-actions">
          <button type="button" class="btn" id="taskCancelBtn">Cancelar</button>
          <button type="submit" class="btn primary">Añadir tarea</button>
        </div>
      </form>
      <div id="taskList"></div>
    </section>

    <footer class="credits">
      Horario personal · festivos según el calendario escolar de Almería 2026‑2027<br />
      Iconos de <a href="https://github.com/dqev/reicon" target="_blank" rel="noopener">reicon</a> (MIT)
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
